services:
  # バックエンドサービスの設定
  - name: my-recipes-backend
    type: web
    runtime: docker
    repo: https://github.com/tako-chan0511/my-recipes
    branch: hara_20250807_CICD
    plan: free
    healthCheckPath: /docs
    envVars:
      - fromGroup: my-recipes-secrets
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile

  # フロントエンドサービスの設定
  - name: my-recipes-frontend
    type: web
    runtime: docker
    repo: https://github.com/tako-chan0511/my-recipes
    branch: hara_20250807_CICD
    plan: free
    envVars:
      # PROXY_PASSの定義のみ残す
      - key: PROXY_PASS
        value: http://my-recipes-backend:8686
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    dependsOn:
      - service: my-recipes-backend