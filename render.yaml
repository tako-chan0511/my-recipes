services:
  # バックエンドサービスの設定
  - name: my-recipes-backend
    type: web
    runtime: docker
    repo: https://github.com/tako-chan0511/my-recipes # あなたのリポジトリURL
    branch: hara_20250807_CICD
    region: singapore
    plan: free
    healthCheckPath: /docs
    envVars:
      - fromGroup: my-recipes-secrets # 環境変数グループから読み込み
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile

  # フロントエンドサービスの設定
  - name: my-recipes-frontend
    type: web
    runtime: docker
    repo: https://github.com/tako-chan0511/my-recipes # あなたのリポジトリURL
    branch: hara_20250807_CICD
    region: singapore
    plan: free
    envVars:
      - key: PROXY_PASS
        value: http://my-recipes-backend:8686
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile