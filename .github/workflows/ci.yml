name: CI for my-recipes

on:
  push:
    branches:
      - hara_20250808_CI
  pull_request:
    branches:
      - hara_20250808_CI

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # ① リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v3

      # ② Python セットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ③ バックエンド依存関係のインストール
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      # ④ バックエンドのユニットテスト実行（PYTHONPATHを明示）
      - name: Run FastAPI tests
        working-directory: backend
        env:
          PYTHONPATH: ./backend
        run: |
          pytest tests

      # ⑤ Node.js セットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ⑥ フロントエンド依存関係のインストール
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # ⑦ フロントエンドのビルド
      - name: Build frontend
        working-directory: frontend
        run: npm run build
